data_dir: /var/lib/polaris-agent
master_address: 127.0.0.1:8443
# 在 Master 服务器执行以下命令，并把输出的单行 Base64 公钥粘贴到下一行：
# sudo -u polaris /usr/local/bin/polaris master show-pubkey --config /etc/polaris/master.yaml
# 这是 Master 的 Noise 公钥，不是 Reality 公钥、TLS 证书或注册令牌。
master_public_key: REPLACE_WITH_MASTER_NOISE_PUBLIC_KEY
heartbeat_interval: 30s
connections_interval: 2s
# 已有网站需要与 polaris 共用同一个 Nginx stream 端口时，在这里声明其 SNI 后端。
# nginx_passthrough_routes:
#   - listen_address: 0.0.0.0
#     port: 443
#     sni: existing.example.com
#     backend_address: 127.0.0.1
#     backend_port: 10444
