data_dir: /var/lib/polaris-master
database_path: /var/lib/polaris-master/polaris.db
agent_port: 19994
web_port: 19670
allow_insecure_http: false
# 所有节点的实时连接上报间隔，由 Master 在握手时下发，改这里即可，无需登录节点。
# 留空使用内置默认值 10s；允许 1s – 30s。
connections_interval: 10s
# 可选：高精度 MaxMind GeoIP2 / GeoLite2 / IPinfo .mmdb 离线库路径
# 留空则默认自动读取 <data_dir>/GeoLite2-City.mmdb，或通过控制台上传/更新；未提供时回退至内置 IP 库
# mmdb_path: /var/lib/polaris-master/GeoLite2-City.mmdb
