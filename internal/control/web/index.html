<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sb-control · 代理服务器控制台</title>
<style>
:root{
  --bg:#0b0e15; --bg2:#0e1220; --elev:#131a2b; --panel:#141c30; --panel2:#182135;
  --border:#212c47; --border-soft:#1a2338; --line:#26324f;
  --fg:#e8edf9; --muted:#93a0bd; --faint:#5f6c8a;
  --acc:#6366f1; --acc2:#8b5cf6; --acc-ink:#c7ccff; --acc-soft:rgba(99,102,241,.14);
  --ok:#22c55e; --ok-soft:rgba(34,197,94,.14); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --bad:#ef4444; --bad-soft:rgba(239,68,68,.14); --info:#38bdf8;
  --r:16px; --r-sm:11px; --r-xs:8px;
  --sh:0 12px 40px -12px rgba(0,0,0,.6); --sh-sm:0 4px 16px -6px rgba(0,0,0,.5);
  --grad:linear-gradient(135deg,var(--acc),var(--acc2));
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 78% -8%,rgba(99,102,241,.10),transparent 60%),radial-gradient(900px 500px at 8% 108%,rgba(139,92,246,.08),transparent 55%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
svg{display:block;flex:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#28324f;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(99,102,241,.35)}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:36px 32px;position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px -4px rgba(99,102,241,.6);flex:none}
.brand-txt b{font-size:18px;letter-spacing:.2px;display:block;line-height:1.2}
.brand-txt span{font-size:12px;color:var(--muted)}
.login-card h1{font-size:16px;margin:26px 0 4px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.lg-field{margin-bottom:14px}
.lg-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.lg-field input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);transition:.15s}
.lg-field input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.login-card .btn{width:100%;margin-top:8px}
.lg-err{background:var(--bad-soft);color:#fca5a5;border:1px solid rgba(239,68,68,.3);padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:14px;display:none}
.lg-err.show{display:block}
.lg-step-mfa{display:none}

/* ---------- Shell ---------- */
#app{display:none;height:100%;position:relative;z-index:1}
.shell{display:grid;grid-template-columns:248px 1fr;height:100%}
.sidebar{background:linear-gradient(180deg,rgba(19,26,43,.7),rgba(11,14,21,.7));border-right:1px solid var(--border-soft);display:flex;flex-direction:column;backdrop-filter:blur(8px);min-height:0}
.sb-top{padding:20px 18px 14px;display:flex;align-items:center;gap:11px}
.sb-top .logo{width:34px;height:34px;border-radius:10px}
.sb-top b{font-size:15.5px;letter-spacing:.2px}
.sb-top .tag{font-size:10.5px;color:var(--faint);letter-spacing:.5px;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:8px 12px 12px;min-height:0}
.nav-group{margin-top:14px}
.nav-group>span{display:block;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);padding:0 10px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;transition:.13s;position:relative;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--fg)}
.nav-item.active{background:var(--acc-soft);color:var(--acc-ink)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--grad);border-radius:0 3px 3px 0}
.nav-item svg{opacity:.9}
.nav-item .badge{margin-left:auto;background:var(--acc);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.sb-bot{padding:12px;border-top:1px solid var(--border-soft)}
.op-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,.03)}
.op-avatar{width:32px;height:32px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.op-info{min-width:0;flex:1}
.op-info b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-info span{font-size:11px;color:var(--muted)}
.op-card .icon-btn{color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;border-bottom:1px solid var(--border-soft);background:rgba(11,14,21,.55);backdrop-filter:blur(8px)}
.topbar .menu-btn{display:none}
.tb-title h2{font-size:17px;font-weight:650;letter-spacing:.2px}
.tb-title p{font-size:12.5px;color:var(--muted);margin-top:1px}
.tb-spacer{flex:1}
.content{flex:1;overflow-y:auto;padding:26px;min-height:0;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;transition:.14s;white-space:nowrap;border:1px solid transparent}
.btn svg{margin:-1px 0}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px -8px rgba(99,102,241,.7)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--fg);border-color:var(--border)}
.btn.ghost:hover{background:rgba(255,255,255,.09)}
.btn.subtle{background:transparent;color:var(--muted);border-color:var(--border)}
.btn.subtle:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.btn.danger:hover{background:rgba(239,68,68,.22)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;filter:none!important}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:.14s}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--fg)}

/* ---------- Cards / layout ---------- */
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--border-soft);border-radius:var(--r);box-shadow:var(--sh-sm)}
.section{margin-bottom:26px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-head h3{font-size:15.5px;font-weight:650}
.sec-head .sub{font-size:12.5px;color:var(--muted)}
.sec-head .sp{flex:1}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,1fr)}
.cards-3{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.cards-2{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}

.stat{padding:18px 18px;position:relative;overflow:hidden}
.stat .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--acc-ink);margin-bottom:14px}
.stat .v{font-size:26px;font-weight:720;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.g1 .ic{background:var(--acc-soft);color:var(--acc-ink)}
.stat.g2 .ic{background:var(--ok-soft);color:#86efac}
.stat.g3 .ic{background:var(--warn-soft);color:#fcd34d}
.stat.g4 .ic{background:rgba(56,189,248,.14);color:#7dd3fc}

/* node cards */
.node{padding:0;overflow:hidden;display:flex;flex-direction:column}
.node-h{padding:16px 17px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border-soft)}
.node-h .nm{flex:1;min-width:0}
.node-h .nm b{font-size:15px;display:flex;align-items:center;gap:8px}
.node-h .nm .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;position:relative}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2.2s infinite}
.dot.off{background:var(--faint)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.node-body{padding:15px 17px;display:flex;flex-direction:column;gap:14px;flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.kv .i .l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.kv .i .val{font-size:13px;margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.traffic{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tf{background:rgba(255,255,255,.03);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:11px 12px}
.tf .l{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tf .v{font-size:18px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tf.dn .l svg{color:#7dd3fc}.tf.up .l svg{color:#fcd34d}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.node-f{padding:12px 17px;border-top:1px solid var(--border-soft);display:flex;gap:8px;flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--border-soft);color:var(--muted)}
.chip.on{background:var(--ok-soft);color:#86efac;border-color:transparent}
.chip.off{background:rgba(148,160,189,.12);color:var(--muted);border-color:transparent}
.chip.acc{background:var(--acc-soft);color:var(--acc-ink);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:#fcd34d;border-color:transparent}
.chip.bad{background:var(--bad-soft);color:#fca5a5;border-color:transparent}
.chip.info{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:transparent}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border-soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:11px 15px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);font-weight:600;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border-soft);white-space:nowrap}
tbody td{padding:12px 15px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:.1s}
tbody tr:hover{background:rgba(255,255,255,.022)}
td .mono,.mono{font-family:var(--mono);font-size:12px}
td.actions{text-align:right;white-space:nowrap}
td.actions .icon-btn{width:30px;height:30px}

/* list panel rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:14px 17px;border-bottom:1px solid var(--border-soft)}
.row:last-child{border-bottom:none}
.row .main-c{flex:1;min-width:0}
.row .main-c b{font-size:14px}
.row .main-c .sub{font-size:12px;color:var(--muted);margin-top:2px}
.row .acts{display:flex;gap:6px;align-items:center}

/* empty / error / loading */
.empty{padding:52px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .eic{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--faint);margin-bottom:8px}
.empty .et{font-size:15px;font-weight:600}
.empty .ed{font-size:13px;color:var(--muted);max-width:420px}
.empty.err .eic{background:var(--bad-soft);color:#fca5a5}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--muted);font-size:13.5px}
.spin{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* toolbar (node selector) */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.node-select{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 11px}
.node-select label{font-size:12px;color:var(--muted)}
.node-select select{background:transparent;border:none;color:var(--fg);font-weight:600;outline:none;padding-right:4px}
.node-select select option{background:var(--elev)}

/* segmented view tabs */
.tabs{display:inline-flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.tabs button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);transition:.13s}
.tabs button.active{background:var(--acc-soft);color:var(--acc-ink)}

/* ---------- Modal / form engine ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,8,14,.66);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:680px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--border-soft)}
.modal-t{font-size:16.5px;font-weight:650}
.modal-s{font-size:12.5px;color:var(--muted);margin-top:3px}
.modal-h .icon-btn{margin-left:auto;margin-top:-4px}
.modal-b{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.modal-f{padding:15px 22px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px}
.modal-msg{font-size:13.5px;color:var(--muted);line-height:1.6}

.field{display:flex;flex-direction:column;gap:7px}
.field-l{display:flex;flex-direction:column;gap:2px}
.field-l label{font-size:13px;font-weight:600}
.field-l .req{color:var(--bad)}
.field-hint{font-size:11.5px;color:var(--muted);font-weight:400}
.field-c{position:relative}
.field-c input[type=text],.field-c input[type=number],.field-c input[type=password],.field-c select,.field-c textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);transition:.14s}
.field-c textarea{resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.field-c input:focus,.field-c select:focus,.field-c textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.field-c select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) calc(50% - 1px),calc(100% - 12px) calc(50% - 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.field-c select option{background:var(--elev)}
.field-c.has-suffix input{padding-right:74px}
.in-suffix{position:absolute;right:5px;top:5px;bottom:5px;padding:0 12px;background:var(--acc-soft);color:var(--acc-ink);border-radius:8px;font-size:12px;font-weight:600}
.in-suffix:hover{background:rgba(99,102,241,.24)}

/* switch */
.switch{position:relative;display:inline-block;width:44px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--line);border-radius:25px;transition:.2s;cursor:pointer}
.slider::before{content:"";position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--acc)}
.switch input:checked+.slider::before{transform:translateX(19px)}
.field.switch-field{flex-direction:row;align-items:center;justify-content:space-between}
.field.switch-field .field-l{flex:1}

/* segmented control */
.seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.seg-b{flex:1;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);transition:.13s;text-align:center}
.seg-b:hover{color:var(--fg)}
.seg-b.active{background:var(--acc-soft);color:var(--acc-ink)}

/* tags */
.tags .tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.tags .tags-wrap:empty{display:none}
.tags .chip button{margin-left:2px;color:var(--muted);font-size:14px;line-height:1;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.tags .chip button:hover{background:rgba(255,255,255,.12);color:var(--fg)}
.tags-in{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg)}
.tags-in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}

/* multiselect */
.ms{display:flex;flex-direction:column;gap:2px;max-height:210px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px}
.ms-o{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;transition:.1s}
.ms-o:hover{background:rgba(255,255,255,.04)}
.ms-o input{width:16px;height:16px;accent-color:var(--acc)}
.ms-empty{padding:14px;text-align:center;color:var(--muted);font-size:12.5px}

/* code block */
.codeblk{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;font-family:var(--mono);font-size:12px;color:#b8c4e0;white-space:pre-wrap;word-break:break-all;position:relative;line-height:1.6}
.codeblk .cp{position:absolute;top:8px;right:8px}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:var(--r-sm);background:var(--elev);border:1px solid var(--border);box-shadow:var(--sh);font-size:13.5px;font-weight:500;min-width:240px;max-width:380px;animation:slidein .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.ok{border-left:3px solid var(--ok)}.toast.error{border-left:3px solid var(--bad)}.toast.info{border-left:3px solid var(--info)}
.toast .ti{flex:none}.toast.ok .ti{color:var(--ok)}.toast.error .ti{color:var(--bad)}.toast.info .ti{color:var(--info)}

.hint-box{background:var(--acc-soft);border:1px solid rgba(99,102,241,.24);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:var(--acc-ink);display:flex;gap:10px;line-height:1.55}
.hint-box svg{flex:none;margin-top:1px}

/* responsive */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}

</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="brand">
      <div class="logo" id="lg-logo"></div>
      <div class="brand-txt"><b>sb-control</b><span>代理服务器控制台</span></div>
    </div>
    <div class="lg-step lg-step-cred">
      <h1>登录</h1>
      <div class="sub">输入账号密码以继续</div>
      <div class="lg-err" id="lg-err1"></div>
      <div class="lg-field"><label>邮箱</label><input id="lg-email" type="text" autocomplete="username" placeholder="admin@example.com"></div>
      <div class="lg-field"><label>密码</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn primary" id="lg-next">继续</button>
    </div>
    <div class="lg-step lg-step-mfa">
      <h1>两步验证</h1>
      <div class="sub">输入身份验证器中的 6 位动态码</div>

      <button class="btn primary" id="lg-login">登录</button>
      <button class="btn subtle" id="lg-back" style="width:100%;margin-top:8px">返回</button>

</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="scrim" id="scrim"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sb-top"><div class="logo" id="sb-logo"></div><div><b>sb-control</b><div class="tag">Proxy Console</div></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="sb-bot">
        <div class="op-card">
          <div class="op-avatar" id="op-avatar">A</div>
          <div class="op-info"><b id="op-email">—</b><span id="op-role">—</span></div>
          <button class="icon-btn" id="btn-logout" title="退出登录"></button>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn"></button>
        <div class="tb-title"><h2 id="tb-title">概览</h2><p id="tb-sub"></p></div>
        <div class="tb-spacer"></div>
        <button class="icon-btn" id="btn-refresh" title="刷新"></button>

</div>

<div id="toasts"></div>

<script>
"use strict";
/* ==================== state & utils ==================== */
const S = { role:null, email:null, csrf:null, view:'dashboard', nodes:[], node:localStorage.getItem('sb_node')||'' };
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin = ()=>S.role==='admin';
const canWrite = ()=>S.role==='admin'||S.role==='operator';

function svg(inner,size=20){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;}
const ICON={
  grid:svg('<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>'),
  activity:svg('<path d="M3 12h4l3 8 4-16 3 8h4"/>'),
  history:svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l3 2"/>'),
  server:svg('<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7.5" cy="7.5" r="1"/><circle cx="7.5" cy="16.5" r="1"/>'),
  inbound:svg('<path d="M4 12h11"/><path d="M11 8l4 4-4 4"/><path d="M20 4v16"/>'),
  outbound:svg('<path d="M4 4v16"/><path d="M9 12h11"/><path d="M16 8l4 4-4 4"/>'),
  rss:svg('<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/>'),
  route:svg('<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 3 3v6.5"/><path d="M6 8.5V15a3 3 0 0 0 3 3h6.5"/>'),
  shield:svg('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9.5 12l1.8 1.8L15 10"/>'),
  cloud:svg('<path d="M7 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.6 1.4A3.5 3.5 0 0 1 17 18z"/>'),
  settings:svg('<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2.2-1.3L14 2h-4l-.3 2.5A7 7 0 0 0 7.5 5.8l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.3l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2.2 1.3L10 22h4l.3-2.5a7 7 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"/>'),
  x:svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  refresh:svg('<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>'),
  trash:svg('<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>',18),
  edit:svg('<path d="M12 20h9"/><path d="M16.5 3.5a2 2 0 0 1 3 3L7 19l-4 1 1-4z"/>',18),
  power:svg('<path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/>',18),
  check:svg('<path d="M20 6 9 17l-5-5"/>'),
  warn:svg('<path d="M12 3l9.5 16.5H2.5z"/><path d="M12 10v4M12 17.5h.01"/>'),
  menu:svg('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  logout:svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',18),
  key:svg('<circle cx="8" cy="8" r="4"/><path d="M10.8 10.8 20 20M17 17l2-2M14 14l2-2"/>'),
  cert:svg('<path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><circle cx="12" cy="14" r="2.2"/><path d="M10.5 15.8 9.5 20l2.5-1.4L14.5 20l-1-4.2"/>'),
  users:svg('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 20a5.5 5.5 0 0 0-3-4.9"/>'),
  dn:svg('<path d="M12 4v14M6 12l6 6 6-6"/>',15),
  up:svg('<path d="M12 20V6M6 12l6-6 6 6"/>',15),
  box:svg('<path d="M12 3 3 7.5v9L12 21l9-4.5v-9z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>'),
  link:svg('<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/>',18),
  copy:svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',15),
  info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',16),
  inbox:svg('<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>'),
};

function fmtBytes(n){n=Number(n)||0;const u=['B','KB','MB','GB','TB','PB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return (i?n.toFixed(n<10?2:1):Math.round(n))+' '+u[i];}
function rel(ts){if(!ts)return '—';const t=Date.parse(ts);if(isNaN(t))return ts;let s=Math.floor((Date.now()-t)/1000);if(s<0)s=0;if(s<60)return s+' 秒前';const m=Math.floor(s/60);if(m<60)return m+' 分钟前';const h=Math.floor(m/60);if(h<24)return h+' 小时前';const d=Math.floor(h/24);return d+' 天前';}
function fmtTime(ts){if(!ts)return '—';const d=new Date(ts);if(isNaN(d))return ts;return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function uuid(){return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));}

/* ==================== api ==================== */
function apiErr(status,msg){const e=new Error(msg);e.status=status;return e;}
async function api(path,{method='GET',body}={}){
  const opt={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};
  if(S.csrf)opt.headers['X-CSRF-Token']=S.csrf;
  if(body!==undefined)opt.body=typeof body==='string'?body:JSON.stringify(body);
  const res=await fetch('/api/v1'+path,opt);
  if(res.status===401){onUnauthorized();throw apiErr(401,'会话已过期，请重新登录');}
  if(res.status===204)return null;
  let data=null;const ct=res.headers.get('content-type')||'';
  if(ct.includes('json')){data=await res.json().catch(()=>null);}else{data=await res.text().catch(()=>null);}
  if(!res.ok){const m=(data&&data.error)||(typeof data==='string'&&data)||('请求失败 ('+res.status+')');throw apiErr(res.status,friendlyErr(m));}
  return data;
}
function friendlyErr(m){const map={'not found':'资源不存在','permission denied':'没有操作权限','authentication failed':'认证失败','conflicting state':'状态冲突（可能已存在或被占用）','invalid request':'请求无效，请检查填写内容'};return map[m]||m;}

/* ==================== toast ==================== */
function toast(msg,type='ok',ms=3200){
  const ic=type==='error'?ICON.warn:type==='info'?ICON.info:ICON.check;
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`<span class="ti">${ic}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateX(30px)';setTimeout(()=>t.remove(),300);},ms);
}

/* ==================== login ==================== */
$('#lg-logo').innerHTML=$('#sb-logo').innerHTML=ICON.shield;
$('#btn-logout').innerHTML=ICON.logout;$('#menu-btn').innerHTML=ICON.menu;$('#btn-refresh').innerHTML=ICON.refresh;
let challengeId=null;
function lgErr(step,msg){const e=$(step===1?'#lg-err1':'#lg-err2');if(msg){e.textContent=msg;e.classList.add('show');}else e.classList.remove('show');}
$('#lg-next').onclick=async()=>{
  const email=$('#lg-email').value.trim(),password=$('#lg-pass').value;
  if(!email||!password){lgErr(1,'请输入邮箱和密码');return;}
  lgErr(1);const b=$('#lg-next');b.disabled=true;b.textContent='验证中…';
  try{const r=await api('/auth/login',{method:'POST',body:{email,password}});challengeId=r.challenge_id;$('.lg-step-cred').style.display='none';$('.lg-step-mfa').style.display='block';$('#lg-code').focus();}
  catch(err){lgErr(1,err.status===401?'邮箱或密码错误':err.message);}
  finally{b.disabled=false;b.textContent='继续';}
};
$('#lg-back').onclick=()=>{$('.lg-step-mfa').style.display='none';$('.lg-step-cred').style.display='block';lgErr(2);};
$('#lg-login').onclick=async()=>{
  const code=$('#lg-code').value.trim();
  if(!/^\d{6}$/.test(code)){lgErr(2,'请输入 6 位数字验证码');return;}
  lgErr(2);const b=$('#lg-login');b.disabled=true;b.textContent='登录中…';
  try{const r=await api('/auth/mfa',{method:'POST',body:{challenge_id:challengeId,code}});S.csrf=r.csrf_token;S.role=r.role;await enterApp();}
  catch(err){lgErr(2,err.status===401?'验证码错误或已过期':err.message);}
  finally{b.disabled=false;b.textContent='登录';}
};
$('#lg-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lg-next').click();});
$('#lg-code').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lg-login').click();});

function onUnauthorized(){S.csrf=null;S.role=null;$('#app').style.display='none';$('#login').style.display='flex';$('.lg-step-mfa').style.display='none';$('.lg-step-cred').style.display='block';}
$('#btn-logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'});}catch{}onUnauthorized();};

function fillOp(){$('#op-email').textContent=S.email||'—';$('#op-role').textContent=({admin:'管理员',operator:'运维',viewer:'只读'}[S.role]||S.role||'—');$('#op-avatar').textContent=(S.email||'A').charAt(0).toUpperCase();}
async function enterApp(){
  try{const me=await api('/auth/me');S.email=me.email;S.role=me.role;if(me.csrf_token)S.csrf=me.csrf_token;}catch{}
  $('#login').style.display='none';$('#app').style.display='block';
  fillOp();buildNav();
  window.addEventListener('hashchange',route);
  route();
}
/* restore session on load: /auth/me rehydrates the CSRF token so writes work after a refresh */
(async()=>{try{const me=await api('/auth/me');S.email=me.email;S.role=me.role;if(me.csrf_token)S.csrf=me.csrf_token;$('#login').style.display='none';$('#app').style.display='block';fillOp();buildNav();window.addEventListener('hashchange',route);route();}catch{onUnauthorized();}})();

/* ==================== navigation ==================== */
const NAV=[
  {g:'监控',items:[
    {id:'dashboard',label:'概览',icon:'grid',sub:'集群与节点总览'},
    {id:'connections',label:'实时连接',icon:'activity',sub:'查看节点当前活跃连接'},
    {id:'audit',label:'任务与审计',icon:'history',sub:'配置下发任务与操作日志'},
  ]},
  {g:'配置',items:[
    {id:'nodes',label:'节点',icon:'server',sub:'管理受控节点与注册审批'},
    {id:'listeners',label:'入站服务',icon:'inbound',sub:'代理协议入站与用户凭据'},
    {id:'outbounds',label:'出站方式',icon:'outbound',sub:'直连或经 SOCKS5/HTTP 代理出口'},
    {id:'subscriptions',label:'订阅',icon:'rss',sub:'上游规则订阅与客户端分享链接'},
    {id:'rules',label:'分流规则',icon:'route',sub:'按域名 / IP / 端口分流'},
  ]},
  {g:'安全与系统',items:[
    {id:'security',label:'安全防护',icon:'shield',sub:'防火墙与 Fail2Ban'},
    {id:'cloudflare',label:'Cloudflare',icon:'cloud',sub:'DNS 记录托管'},
    {id:'settings',label:'系统设置',icon:'settings',sub:'运营者、证书与版本'},
  ]},
];
const VIEW_META={};NAV.forEach(g=>g.items.forEach(i=>VIEW_META[i.id]=i));
function buildNav(){
  $('#nav').innerHTML=NAV.map(grp=>`<div class="nav-group"><span>${grp.g}</span>${grp.items.map(i=>`<div class="nav-item" data-id="${i.id}">${ICON[i.icon]}<span>${i.label}</span></div>`).join('')}</div>`).join('');
  $$('#nav .nav-item').forEach(el=>el.onclick=()=>{location.hash='#/'+el.dataset.id;closeSidebar();});
}
function setActive(){$$('#nav .nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===S.view));}
$('#menu-btn').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('show');};
$('#scrim').onclick=closeSidebar;
function closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');}

const VIEWS={dashboard:vDashboard,nodes:vNodes,listeners:vListeners,outbounds:vOutbounds,subscriptions:vSubscriptions,rules:vRules,connections:vConnections,security:vSecurity,cloudflare:vCloudflare,audit:vAudit,settings:vSettings};
async function route(){
  let id=(location.hash.replace(/^#\/?/,'')||'dashboard');
  if(!VIEWS[id])id='dashboard';
  S.view=id;setActive();
  const m=VIEW_META[id];$('#tb-title').textContent=m.label;$('#tb-sub').textContent=m.sub;
  const wrap=$('#content .wrap');wrap.innerHTML='<div class="loading"><div class="spin"></div>加载中…</div>';
  $('#content').scrollTop=0;
  try{await VIEWS[id](wrap);}
  catch(err){wrap.innerHTML=errState(err.message||'加载失败');}
}
$('#btn-refresh').onclick=()=>route();

/* ==================== shared UI helpers ==================== */
function emptyState(icon,title,desc,action){return `<div class="empty"><div class="eic">${ICON[icon]||ICON.inbox}</div><div class="et">${esc(title)}</div>${desc?`<div class="ed">${esc(desc)}</div>`:''}${action?`<div style="margin-top:14px">${action}</div>`:''}</div>`;}
function errState(msg){return `<div class="card"><div class="empty err"><div class="eic">${ICON.warn}</div><div class="et">加载遇到问题</div><div class="ed">${esc(msg)}</div><div style="margin-top:14px"><button class="btn ghost" onclick="route()">${ICON.refresh}重试</button></div></div></div>`;}
function secHead(title,sub,actionHtml){return `<div class="sec-head"><div><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div><div class="sp"></div>${actionHtml||''}</div>`;}
function enabledChip(on){return on?`<span class="chip on">启用</span>`:`<span class="chip off">停用</span>`;}
function needCSRF(){if(!S.csrf){toast('刷新页面后需重新登录才能执行修改操作','info');return true;}return false;}

/* confirm dialog */
function confirmDialog({title,message,confirmLabel='确定',danger,onConfirm}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" style="max-width:420px"><div class="modal-h"><div class="modal-t">${esc(title)}</div><button class="icon-btn mx">${ICON.x}</button></div><div class="modal-b"><div class="modal-msg">${esc(message)}</div></div><div class="modal-f"><button class="btn ghost mc">取消</button><button class="btn ${danger?'danger':'primary'} mo">${esc(confirmLabel)}</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('.mx').onclick=close;ov.querySelector('.mc').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};
  ov.querySelector('.mo').onclick=async()=>{const b=ov.querySelector('.mo');b.disabled=true;b.textContent='处理中…';try{await onConfirm();close();}catch(err){toast(err.message||'操作失败','error');b.disabled=false;b.textContent=confirmLabel;}};
}

/* ==================== FORM ENGINE ==================== */
function optOf(o){return typeof o==='object'?o:{value:o,label:String(o)};}
function fieldHTML(f){
  const id='fc_'+f.key;
  let inner='';
  if(f.type==='textarea')inner=`<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`;
  else if(f.type==='select'){inner=`<select id="${id}">${(f.options||[]).map(optOf).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;}
  else if(f.type==='switch')return `<div class="field switch-field" id="fw_${f.key}"><div class="field-l"><label>${esc(f.label)}</label>${f.hint?`<span class="field-hint">${esc(f.hint)}</span>`:''}</div><label class="switch"><input type="checkbox" id="${id}" ${f.value?'checked':''}><span class="slider"></span></label></div>`;
  else if(f.type==='segmented'){const opts=(f.options||[]).map(optOf);const cur=f.value!=null?f.value:(opts[0]&&opts[0].value);inner=`<input type="hidden" id="${id}" value="${esc(cur)}"><div class="seg" data-for="${id}">${opts.map(o=>`<button type="button" class="seg-b ${String(o.value)===String(cur)?'active':''}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join('')}</div>`;}
  else if(f.type==='tags'){const arr=Array.isArray(f.value)?f.value:[];inner=`<div class="tags" data-key="${f.key}"><input type="hidden" id="${id}" value="${esc(JSON.stringify(arr))}"><div class="tags-wrap" id="tw_${f.key}"></div><input class="tags-in" id="ti_${f.key}" placeholder="${esc(f.placeholder||'输入后回车添加')}"></div>`;}
  else if(f.type==='multiselect'){const arr=Array.isArray(f.value)?f.value:[];const opts=(f.options||[]).map(optOf);inner=`<div class="ms" id="${id}">${opts.length?opts.map(o=>`<label class="ms-o"><input type="checkbox" value="${esc(o.value)}" ${arr.includes(o.value)?'checked':''}><span>${esc(o.label)}</span></label>`).join(''):`<div class="ms-empty">${esc(f.emptyText||'暂无可选项')}</div>`}</div>`;}
  else{const suffix=f.suffix?`<button type="button" class="in-suffix" data-suffix="${f.key}">${esc(f.suffix)}</button>`:'';return `<div class="field" id="fw_${f.key}"><div class="field-l"><label for="${id}">${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label>${f.hint?`<span class="field-hint">${esc(f.hint)}</span>`:''}</div><div class="field-c ${suffix?'has-suffix':''}"><input type="${f.type||'text'}" id="${id}" value="${esc(f.value!=null?f.value:'')}" placeholder="${esc(f.placeholder||'')}">${suffix}</div></div>`;}
  return `<div class="field" id="fw_${f.key}"><div class="field-l"><label for="${id}">${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label>${f.hint?`<span class="field-hint">${esc(f.hint)}</span>`:''}</div><div class="field-c">${inner}</div></div>`;
}
function readAll(fields){
  const v={};
  for(const f of fields){const el=document.getElementById('fc_'+f.key);if(!el){v[f.key]=f.value;continue;}
    if(f.type==='switch')v[f.key]=el.checked;
    else if(f.type==='number')v[f.key]=el.value===''?undefined:Number(el.value);
    else if(f.type==='tags'){try{v[f.key]=JSON.parse(el.value||'[]');}catch{v[f.key]=[];}}
    else if(f.type==='multiselect')v[f.key]=[...el.querySelectorAll('input:checked')].map(x=>x.value);
    else v[f.key]=el.value;
  }
  return v;
}
function syncVisibility(fields){const vals=readAll(fields);for(const f of fields){const w=document.getElementById('fw_'+f.key);if(!w)continue;w.style.display=(!f.show||f.show(vals))?'':'none';}}
function collect(fields){const vals=readAll(fields);const out={};for(const f of fields){if(f.show&&!f.show(vals))continue;out[f.key]=vals[f.key];}return out;}
function validate(fields){const vals=readAll(fields);for(const f of fields){if(f.show&&!f.show(vals))continue;if(f.required){const v=vals[f.key];if(v===undefined||v===''||v===null||(Array.isArray(v)&&!v.length))throw new Error('请填写：'+f.label);}}}

function openForm({title,subtitle,fields,submitLabel='保存',wide,onSubmit}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="modal-h"><div><div class="modal-t">${esc(title)}</div>${subtitle?`<div class="modal-s">${esc(subtitle)}</div>`:''}</div><button class="icon-btn mx">${ICON.x}</button></div><div class="modal-b">${fields.map(fieldHTML).join('')}</div><div class="modal-f"><button class="btn ghost mc">取消</button><button class="btn primary mo">${esc(submitLabel)}</button></div></div>`;
  document.body.appendChild(ov);
  const refreshSelects=()=>{const vals=readAll(fields);for(const f of fields){if(!f.refresh)continue;const el=document.getElementById('fc_'+f.key);if(!el||el.tagName!=='SELECT')continue;const opts=(f.refresh(vals)||[]).map(optOf);const cur=el.value;el.innerHTML=opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(cur)?'selected':''}>${esc(o.label)}</option>`).join('');if(!opts.some(o=>String(o.value)===String(cur)))el.value=opts.length?opts[0].value:'';}};
  const onChange=()=>{refreshSelects();syncVisibility(fields);};
  $$('.seg',ov).forEach(seg=>{const hid=document.getElementById(seg.dataset.for);$$('.seg-b',seg).forEach(b=>b.onclick=()=>{hid.value=b.dataset.v;$$('.seg-b',seg).forEach(x=>x.classList.toggle('active',x===b));onChange();});});
  $$('.tags',ov).forEach(t=>{const key=t.dataset.key,hid=document.getElementById('fc_'+key),wrap=document.getElementById('tw_'+key),input=document.getElementById('ti_'+key);
    const get=()=>{try{return JSON.parse(hid.value||'[]');}catch{return[];}};const set=a=>{hid.value=JSON.stringify(a);draw();onChange();};
    const draw=()=>{const a=get();wrap.innerHTML=a.map((v,i)=>`<span class="chip acc">${esc(v)}<button type="button" data-i="${i}">×</button></span>`).join('');$$('button',wrap).forEach(b=>b.onclick=()=>{const a=get();a.splice(+b.dataset.i,1);set(a);});};
    input.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();const val=input.value.trim().replace(/,+$/,'');if(val){const a=get();if(!a.includes(val))a.push(val);set(a);}input.value='';}else if(e.key==='Backspace'&&!input.value){const a=get();if(a.length){a.pop();set(a);}}};draw();});
  $$('[data-suffix]',ov).forEach(b=>b.onclick=()=>{const f=fields.find(x=>x.key===b.dataset.suffix);const el=document.getElementById('fc_'+f.key);if(f.onSuffix)f.onSuffix(el);});
  ov.addEventListener('input',onChange);ov.addEventListener('change',onChange);
  syncVisibility(fields);
  const close=()=>ov.remove();
  ov.querySelector('.mx').onclick=close;ov.querySelector('.mc').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};
  ov.querySelector('.mo').onclick=async()=>{const b=ov.querySelector('.mo');
    try{validate(fields);}catch(err){toast(err.message,'error');return;}
    b.disabled=true;b.textContent='处理中…';
    try{await onSubmit(collect(fields));close();}
    catch(err){toast(err.message||'操作失败','error');b.disabled=false;b.textContent=submitLabel;}
  };
}

function ruleConds(r){
  const c=[];
  if(r.domains&&r.domains.length)c.push('域名 '+r.domains.slice(0,2).join(', ')+(r.domains.length>2?'…':''));
  if(r.domain_suffix&&r.domain_suffix.length)c.push('后缀 '+r.domain_suffix.slice(0,2).join(', ')+(r.domain_suffix.length>2?'…':''));
  if(r.cidrs&&r.cidrs.length)c.push('IP '+r.cidrs.slice(0,2).join(', ')+(r.cidrs.length>2?'…':''));
  if(r.port)c.push('端口 '+r.port);
  if(r.network)c.push(r.network.toUpperCase());
  return c.length?c.map(x=>`<span class="chip">${esc(x)}</span>`).join(' '):'<span class="chip">全部流量</span>';
}
function ruleActionChip(r){const m={direct:['直连','on'],reject:['拒绝','bad'],outbound:['出站：'+(r.outbound_tag||'?'),'acc']};const x=m[r.action]||[r.action,'off'];return `<span class="chip ${x[1]}">${x[0]}</span>`;}
function ruleRow(r){
  return `<tr><td><b>${r.priority}</b></td><td>${ruleConds(r)}</td><td>${ruleActionChip(r)}</td><td>${enabledChip(r.enabled)}</td><td class="actions">${canWrite()?`<button class="btn subtle sm" data-ract="toggle" data-id="${r.id}">${r.enabled?'停用':'启用'}</button><button class="icon-btn" data-ract="edit" data-id="${r.id}" title="编辑">${ICON.edit}</button><button class="icon-btn" data-ract="delete" data-id="${r.id}" title="删除">${ICON.trash}</button>`:''}</td></tr>`;
}

  html+=`<div class="section">${secHead('DNS 记录',records.length?`共 ${records.length} 条`:'',`${canWrite()?`<button class="btn ghost sm" id="btn-cf-sync">${ICON.refresh}同步</button>`:''}${isAdmin()?`<button class="btn primary sm" id="btn-cf-new">${ICON.plus}新增记录</button>`:''}`)}`;
  if(!records.length)html+=`<div class="card">${emptyState('cloud','还没有托管任何记录','在这里新增 A / AAAA / CNAME / TXT 记录，发布后同步到 Cloudflare。')}</div>`;
  else html+=`<div class="card tbl-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>内容</th><th>代理</th><th>状态</th><th></th></tr></thead><tbody>${records.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="chip acc">${esc(r.type)}</span></td><td class="mono" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(r.content)}</td><td>${r.proxied?'<span class="chip warn">已代理</span>':'<span class="chip">仅解析</span>'}</td><td>${cfStatus(r.status)}</td><td class="actions">${isAdmin()?`<button class="btn subtle sm" data-cf="publish" data-id="${r.id}">发布</button><button class="icon-btn" data-cf="delete" data-id="${r.id}">${ICON.trash}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
  html+=`</div>`;
  wrap.innerHTML=html;
  const o=()=>openCfSettings(cfg);if($('#btn-cf-set'))$('#btn-cf-set').onclick=o;
  if($('#btn-cf-new'))$('#btn-cf-new').onclick=()=>openCfRecord();
  if($('#btn-cf-sync'))$('#btn-cf-sync').onclick=()=>{if(needCSRF())return;confirmDialog({title:'与 Cloudflare 同步？',message:'拉取远端记录并比对本地托管状态。',confirmLabel:'同步',onConfirm:async()=>{const r=await api('/cloudflare/sync',{method:'POST'});toast('同步完成');route();}});};
  $$('[data-cf]',wrap).forEach(b=>b.onclick=()=>cfAction(b.dataset.cf,b.dataset.id));
}
function cfStatus(s){const m={pending:['待发布','off'],synced:['已同步','on'],drift:['有漂移','warn'],missing:['远端缺失','bad'],error:['错误','bad']};const x=m[s]||[s||'—','off'];return `<span class="chip ${x[1]}">${x[0]}</span>`;}
function openCfSettings(cfg){
  if(needCSRF())return;
  openForm({title:'配置 Cloudflare',subtitle:'凭据仅保存在服务端',fields:[
    {key:'zone_id',label:'Zone ID',type:'text',required:true,value:cfg.zone_id||'',placeholder:'Cloudflare Zone ID'},
    {key:'zone_name',label:'Zone 名称',type:'text',value:cfg.zone_name||'',placeholder:'example.com'},
    {key:'api_token',label:'API Token',type:'password',required:true,placeholder:'具备 DNS 编辑权限的 Token'},
  ],submitLabel:'保存',onSubmit:async(v)=>{await api('/cloudflare/settings',{method:'PUT',body:{zone_id:v.zone_id,zone_name:v.zone_name||'',api_token:v.api_token}});toast('已保存');route();}});
}
function openCfRecord(){
  if(needCSRF())return;
  openForm({title:'新增 DNS 记录',fields:[
    {key:'name',label:'名称',type:'text',required:true,placeholder:'sub.example.com'},
    {key:'type',label:'类型',type:'segmented',value:'A',options:['A','AAAA','CNAME','TXT']},
    {key:'content',label:'内容',type:'text',required:true,placeholder:'如 1.2.3.4'},
    {key:'proxied',label:'启用 Cloudflare 代理',type:'switch',value:false,hint:'开启后 TTL 固定为自动'},
    {key:'ttl',label:'TTL（秒）',type:'number',value:1,hint:'1 表示自动',show:v=>!v.proxied},
  ],submitLabel:'创建',onSubmit:async(v)=>{await api('/cloudflare/records',{method:'POST',body:{name:v.name,type:v.type,content:v.content,proxied:!!v.proxied,ttl:v.proxied?1:Number(v.ttl||1)}});toast('已创建，点“发布”同步到 Cloudflare');route();}});
}
function cfAction(act,id){
  if(needCSRF())return;
  if(act==='publish')confirmDialog({title:'发布该记录到 Cloudflare？',message:'将本地记录同步到 Cloudflare。',confirmLabel:'发布',onConfirm:async()=>{await api('/cloudflare/records/'+id+'/publish',{method:'POST',body:{confirm:true}});toast('已发布');route();}});
  else if(act==='delete')confirmDialog({title:'删除该记录？',message:'将同时从 Cloudflare 删除（若存在）。',confirmLabel:'删除',danger:true,onConfirm:async()=>{await api('/cloudflare/records/'+id+'?confirm=true',{method:'DELETE'});toast('已删除');route();}});
}

/* ==================== VIEW: audit ==================== */
async function vAudit(wrap){
  await loadNodes();
  const tasks=(await api('/tasks')).tasks||[];
  let html=`<div class="section">${secHead('下发任务','配置与安装任务的执行记录')}`;
  if(!tasks.length)html+=`<div class="card">${emptyState('history','暂无任务','对节点发布配置或安装组件后，任务会出现在这里。')}</div>`;
  else html+=`<div class="card tbl-wrap"><table><thead><tr><th>类型</th><th>节点</th><th>状态</th><th>结果</th><th>创建</th><th>完成</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${taskKind(t.kind)}</td><td>${esc(nodeName(t.node_id))}</td><td>${taskStatus(t.status)}</td><td style="color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.result_summary||'—')}</td><td style="color:var(--muted)">${fmtTime(t.created_at)}</td><td style="color:var(--muted)">${t.finished_at?fmtTime(t.finished_at):'—'}</td></tr>`).join('')}</tbody></table></div>`;
  html+=`</div>`;
  if(isAdmin()){
    const events=(await api('/audit-events?limit=100').catch(()=>({audit_events:[]}))).audit_events||[];
    html+=`<div class="section">${secHead('操作审计','管理员操作日志')}`;
    if(!events.length)html+=`<div class="card">${emptyState('history','暂无审计记录','操作面板产生的变更会记录在这里。')}</div>`;
    else html+=`<div class="card tbl-wrap"><table><thead><tr><th>操作者</th><th>动作</th><th>对象</th><th>说明</th><th>时间</th></tr></thead><tbody>${events.map(e=>`<tr><td>${esc(e.operator_email||'—')}</td><td><span class="chip">${esc(e.action)}</span></td><td style="color:var(--muted)">${esc(e.target_type||'')}${e.target_id?' · '+esc(String(e.target_id).slice(0,8)):''}</td><td style="color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.summary||'—')}</td><td style="color:var(--muted)">${fmtTime(e.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  wrap.innerHTML=html;
}

/* ==================== VIEW: settings ==================== */
let setTab='operators';
async function vSettings(wrap){
  if(!isAdmin()){wrap.innerHTML=`<div class="card">${emptyState('settings','需要管理员权限','系统设置仅管理员可访问。')}</div>`;return;}
  const tabs=[['operators','运营者'],['certificates','证书'],['reality','Reality 密钥'],['releases','sing-box 版本']];
  let html=`<div class="toolbar"><div class="tabs">${tabs.map(t=>`<button data-stab="${t[0]}" class="${setTab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><div class="tb-spacer" style="flex:1"></div><button class="btn primary" id="btn-set-new">${ICON.plus}${({operators:'新建运营者',certificates:'导入证书',reality:'生成密钥',releases:'登记版本'})[setTab]}</button></div><div id="set-body"><div class="loading"><div class="spin"></div></div></div>`;
  wrap.innerHTML=html;
  $$('[data-stab]',wrap).forEach(b=>b.onclick=()=>{setTab=b.dataset.stab;route();});
  const body=$('#set-body');
  if(setTab==='operators'){$('#btn-set-new').onclick=openOperatorForm;await renderOperators(body);}
  else if(setTab==='certificates'){$('#btn-set-new').onclick=openCertForm;await renderCerts(body);}
  else if(setTab==='reality'){$('#btn-set-new').onclick=openRealityForm;await renderReality(body);}
  else if(setTab==='releases'){$('#btn-set-new').onclick=openReleaseForm;await renderReleases(body);}
}
async function renderOperators(el){
  const ops=(await api('/operators')).operators||[];
  el.innerHTML=`<div class="card tbl-wrap"><table><thead><tr><th>邮箱</th><th>角色</th><th>状态</th><th>最后登录</th><th></th></tr></thead><tbody>${ops.map(o=>`<tr><td><b>${esc(o.email)}</b></td><td><span class="chip acc">${({admin:'管理员',operator:'运维',viewer:'只读'})[o.role]||o.role}</span></td><td>${o.enabled?'<span class="chip on">启用</span>':'<span class="chip off">停用</span>'}</td><td style="color:var(--muted)">${o.last_login_at?fmtTime(o.last_login_at):'从未'}</td><td class="actions"><button class="btn subtle sm" data-op="edit" data-id="${o.id}" data-role="${o.role}" data-en="${o.enabled?1:0}">编辑</button><button class="btn subtle sm" data-op="pwd" data-id="${o.id}">改密</button><button class="btn subtle sm" data-op="totp" data-id="${o.id}">重置 2FA</button></td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-op]',el).forEach(b=>b.onclick=()=>opAction(b.dataset.op,b.dataset.id,b.dataset.role,b.dataset.en==='1'));
}
function openOperatorForm(){
  if(needCSRF())return;
  openForm({title:'新建运营者',fields:[
    {key:'email',label:'邮箱',type:'text',required:true,placeholder:'user@example.com'},
    {key:'password',label:'初始密码',type:'password',required:true,placeholder:'至少 8 位'},
    {key:'role',label:'角色',type:'segmented',value:'operator',options:[{value:'admin',label:'管理员'},{value:'operator',label:'运维'},{value:'viewer',label:'只读'}]},
  ],submitLabel:'创建',onSubmit:async(v)=>{const r=await api('/operators',{method:'POST',body:{email:v.email,password:v.password,role:v.role}});route();if(r.totp_secret)showCodeModal('新账户 2FA 密钥','请用身份验证器扫码或手动添加',r.totp_secret);}});
}
function opAction(act,id,role,en){
  if(needCSRF())return;
  if(act==='edit')openForm({title:'编辑运营者',fields:[
    {key:'role',label:'角色',type:'segmented',value:role,options:[{value:'admin',label:'管理员'},{value:'operator',label:'运维'},{value:'viewer',label:'只读'}]},
    {key:'enabled',label:'启用',type:'switch',value:en},
  ],submitLabel:'保存',onSubmit:async(v)=>{await api('/operators/'+id,{method:'PUT',body:{role:v.role,enabled:!!v.enabled}});toast('已保存');route();}});
  else if(act==='pwd')openForm({title:'重置密码',fields:[{key:'password',label:'新密码',type:'password',required:true,placeholder:'至少 8 位'}],submitLabel:'重置',onSubmit:async(v)=>{await api('/operators/'+id+'/password',{method:'POST',body:{password:v.password}});toast('密码已更新');}});
  else if(act==='totp')confirmDialog({title:'重置该账户 2FA？',message:'将生成新的 2FA 密钥，旧密钥立即失效。',confirmLabel:'重置',onConfirm:async()=>{const r=await api('/operators/'+id+'/totp/reset',{method:'POST'});showCodeModal('新 2FA 密钥','请用身份验证器扫码或手动添加',r.totp_secret);}});
}
async function renderCerts(el){
  const certs=(await api('/certificates')).certificates||[];
  if(!certs.length){el.innerHTML=`<div class="card">${emptyState('cert','还没有导入证书','TLS 入站服务需要证书。导入 PEM 格式的证书与私钥即可。',`<button class="btn primary" id="c2">${ICON.plus}导入证书</button>`)}</div>`;$('#c2').onclick=openCertForm;return;}
  el.innerHTML=`<div class="card tbl-wrap"><table><thead><tr><th>名称</th><th>状态</th><th>创建</th><th></th></tr></thead><tbody>${certs.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${enabledChip(c.enabled)}</td><td style="color:var(--muted)">${fmtTime(c.created_at)}</td><td class="actions"><button class="icon-btn" data-cert="delete" data-id="${c.id}">${ICON.trash}</button></td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-cert]',el).forEach(b=>b.onclick=()=>{if(needCSRF())return;confirmDialog({title:'删除该证书？',message:'若被入站服务引用将无法删除。',confirmLabel:'删除',danger:true,onConfirm:async()=>{await api('/certificates/'+b.dataset.id,{method:'DELETE'});toast('已删除');route();}});});
}
function openCertForm(){
  if(needCSRF())return;
  openForm({title:'导入证书',wide:true,fields:[
    {key:'name',label:'名称',type:'text',required:true,placeholder:'example.com'},
    {key:'certificate_pem',label:'证书 PEM',type:'textarea',required:true,rows:5,placeholder:'-----BEGIN CERTIFICATE-----'},
    {key:'private_key_pem',label:'私钥 PEM',type:'textarea',required:true,rows:5,placeholder:'-----BEGIN PRIVATE KEY-----'},
  ],submitLabel:'导入',onSubmit:async(v)=>{await api('/certificates',{method:'POST',body:{name:v.name,certificate_pem:v.certificate_pem,private_key_pem:v.private_key_pem,enabled:true}});toast('已导入证书');route();}});
}
async function renderReality(el){
  const keys=(await api('/reality-keys')).reality_keys||[];
  if(!keys.length){el.innerHTML=`<div class="card">${emptyState('key','还没有 Reality 密钥','Reality 入站需要一对密钥。点击生成，服务端会保存私钥。',`<button class="btn primary" id="k2">${ICON.plus}生成密钥</button>`)}</div>`;$('#k2').onclick=openRealityForm;return;}
  el.innerHTML=`<div class="card tbl-wrap"><table><thead><tr><th>名称</th><th>公钥</th><th>状态</th><th></th></tr></thead><tbody>${keys.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td class="mono" style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${esc(k.public_key)}</td><td>${enabledChip(k.enabled)}</td><td class="actions"><button class="btn subtle sm" data-rk="toggle" data-id="${k.id}" data-en="${k.enabled?1:0}">${k.enabled?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-rk]',el).forEach(b=>b.onclick=()=>{if(needCSRF())return;api('/reality-keys/'+b.dataset.id+'/enabled',{method:'POST',body:{enabled:b.dataset.en!=='1'}}).then(()=>{toast('已更新');route();}).catch(e=>toast(e.message,'error'));});
}
function openRealityForm(){
  if(needCSRF())return;
  openForm({title:'生成 Reality 密钥',fields:[{key:'name',label:'名称',type:'text',required:true,placeholder:'reality-key-1'}],submitLabel:'生成',onSubmit:async(v)=>{const r=await api('/reality-keys',{method:'POST',body:{name:v.name}});route();if(r.private_key)showCodeModal('Reality 私钥','请立即保存，私钥仅显示一次',r.private_key);}});
}
async function renderReleases(el){
  const rels=(await api('/sing-box/releases')).releases||[];
  if(!rels.length){el.innerHTML=`<div class="card">${emptyState('box','还没有登记 sing-box 版本','登记版本后，才能对节点执行“安装 / 升级”。',`<button class="btn primary" id="r2">${ICON.plus}登记版本</button>`)}</div>`;$('#r2').onclick=openReleaseForm;return;}
  el.innerHTML=`<div class="card tbl-wrap"><table><thead><tr><th>版本</th><th>架构</th><th>状态</th><th>创建</th></tr></thead><tbody>${rels.map(r=>`<tr><td><b>${esc(r.version)}</b></td><td><span class="chip">${esc(r.architecture)}</span></td><td>${enabledChip(r.enabled)}</td><td style="color:var(--muted)">${fmtTime(r.created_at)}</td></tr>`).join('')}</tbody></table></div>`;
}
function openReleaseForm(){
  if(needCSRF())return;
  openForm({title:'登记 sing-box 版本',subtitle:'指向可下载的二进制及其校验和',wide:true,fields:[
    {key:'version',label:'版本号',type:'text',required:true,placeholder:'1.9.0'},
    {key:'architecture',label:'架构',type:'segmented',value:'arm64',options:[{value:'arm64',label:'arm64'},{value:'amd64',label:'amd64'}]},
    {key:'url',label:'下载地址',type:'text',required:true,placeholder:'https://...'},
    {key:'sha256',label:'SHA-256',type:'text',required:true,placeholder:'64 位十六进制校验和'},
  ],submitLabel:'登记',onSubmit:async(v)=>{await api('/sing-box/releases',{method:'POST',body:{version:v.version,architecture:v.architecture,url:v.url,sha256:v.sha256,enabled:true}});toast('已登记版本');route();}});
}
</script>
</body>
</html>
