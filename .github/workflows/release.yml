name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate installer
        run: bash scripts_install_test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build embedded Web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build and package
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          package="sb-control_${version}_linux_${GOARCH}"

          mkdir -p "package/${package}" dist

          go build \
            -trimpath \
            -o "package/${package}/sb-control" \
            ./cmd/sb-control

          chmod 0755 "package/${package}/sb-control"

          cp README.md "package/${package}/"
          cp install.sh "package/${package}/"
          cp -R deploy "package/${package}/"
          chmod 0755 "package/${package}/install.sh"

          tar -C package -czf "dist/${package}.tar.gz" "${package}"

          (
            cd dist
            sha256sum "${package}.tar.gz" \
              > "${package}.tar.gz.sha256"
          )

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: sb-control-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --generate-notes \
              --verify-tag
          fi
